name: mongo-sharding-repl

services:
  configSrv:
    image: dh-mirror.gitverse.ru/mongo:latest
    volumes:
      - configSrv_data_container:/data/configdb
    command: ["--configsvr", "--replSet", "config_server", "--bind_ip_all", "--port", "27017"]

  shard1-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    volumes:
      - shard1-1_data_container:/data/db
    command: ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]

  shard1-2:
    image: dh-mirror.gitverse.ru/mongo:latest
    volumes:
      - shard1-2_data_container:/data/db
    command: ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]

  shard1-3:
    image: dh-mirror.gitverse.ru/mongo:latest
    volumes:
      - shard1-3_data_container:/data/db
    command: ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]

  shard2-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    volumes:
      - shard2-1_data_container:/data/db
    command: ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019"]

  shard2-2:
    image: dh-mirror.gitverse.ru/mongo:latest
    volumes:
      - shard2-2_data_container:/data/db
    command: ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019"]

  shard2-3:
    image: dh-mirror.gitverse.ru/mongo:latest
    volumes:
      - shard2-3_data_container:/data/db
    command: ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019"]

  mongos_router:
    image: dh-mirror.gitverse.ru/mongo:latest
    depends_on:
      - configSrv
      - shard1-1
      - shard1-2
      - shard1-3
      - shard2-1
      - shard2-2
      - shard2-3
    command: ["mongos", "--configdb", "config_server/configSrv:27017", "--bind_ip_all", "--port", "27020"]

  pymongo_api:
    image: kazhem/pymongo_api:1.0.0
    depends_on:
      - mongos_router
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020"
      MONGODB_DATABASE_NAME: "somedb"


volumes:
  configSrv_data_container:
  shard1-1_data_container:
  shard1-2_data_container:
  shard1-3_data_container:
  shard2-1_data_container:
  shard2-2_data_container:
  shard2-3_data_container:
